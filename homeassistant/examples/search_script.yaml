# Example search helpers for the MC40 Configuration blueprint "On search" action.
#
# In the blueprint Event handlers → On search, chain something like:
#
#   1. action: script.mc40_product_search
#      data:
#        search_id: "{{ trigger.event.data.search_id }}"
#        query: "{{ trigger.event.data.query }}"
#        mode: "{{ trigger.event.data.mode }}"
#        device_id: "{{ trigger.event.data.device_id }}"
#      response_variable: result
#   2. variables:
#        items: "{{ result['items'] | default([]) }}"
#
# The blueprint then notifies search_results from the `items` variable.
# Use script mode: parallel or restart (not queued) so response_variable works.
#
# Or skip the script and set `items` directly with a variables / template action.

script:
  mc40_product_search:
    alias: MC40 product search
    mode: parallel
    fields:
      search_id:
        description: Correlation id from the device
        example: products
      query:
        description: User search text
        example: flour
      mode:
        description: Current scanner mode
      device_id:
        description: MC40 device name
    sequence:
      - variables:
          q: "{{ query | default('') | lower }}"
          # Replace this stub with a real lookup (shopping list, Grocy, template, etc.).
          matched:
            - id: "200012570"
              label: Plain flour
              subtitle: "1 kg"
            - id: "200012571"
              label: Self-raising flour
              subtitle: "500 g"
          filtered: >-
            {{ matched
               | selectattr('label', 'search', query | default(''), true)
               | list }}
          # Build the response mapping in one template so `items` stays a real list.
          result: "{{ {'items': filtered} }}"
      - stop: Search complete
        response_variable: result

