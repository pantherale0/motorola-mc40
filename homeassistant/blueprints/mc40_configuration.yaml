blueprint:
  name: MC40 Configuration
  description: >
    Required home-screen configuration for the Motorola MC40 companion (schema 3).
    Responds to mc40_boot with mode slots, optional pages/widgets, and legacy home
    actions when no pages are set. Also handles mc40_search via an optional script
    (response_variable items). step=complete is ignored so the handshake cannot loop.
  domain: automation
  source_url: https://github.com/pantherale0/motorola-mc40
  author: pantherale0
  homeassistant:
    min_version: 2024.6.0
  input:
    notify_device:
      name: MC40 device
      description: The mobile_app device to configure.
      selector:
        device:
          filter:
            - integration: mobile_app
    device_id:
      name: Device ID
      description: Must match the device name sent in mc40_boot / mc40_search events.
      default: MC40N0
      selector:
        text:
    default_mode:
      name: Default mode ID
      description: Used when the previously selected mode is not in this configuration.
      default: use
      selector:
        text:
    default_page:
      name: Default page ID
      description: Opening page when pages are configured. Leave empty to use the first page.
      default: home
      selector:
        text:
    search_script:
      name: Search script
      description: >
        Optional. Called on mc40_search with search_id, query, mode, device_id.
        Must return a mapping { items: [ {id, label, subtitle?}, ... ] } via
        response_variable. Access as search_result['items'] (not .items).
        Use script mode parallel or restart (not queued).
      default:
      selector:
        entity:
          domain: script
    slot_1_id:
      name: Slot 1 ID
      default: use
      selector:
        text:
    slot_1_label:
      name: Slot 1 label
      default: Use
      selector:
        text:
    slot_1_behavior:
      name: Slot 1 behavior
      default: use
      selector:
        select:
          options:
            - label: Use
              value: use
            - label: Shopping
              value: shopping
            - label: Custom
              value: custom
    slot_2_id:
      name: Slot 2 ID
      default: shopping
      selector:
        text:
    slot_2_label:
      name: Slot 2 label
      default: Shopping
      selector:
        text:
    slot_2_behavior:
      name: Slot 2 behavior
      default: shopping
      selector:
        select:
          options:
            - label: Use
              value: use
            - label: Shopping
              value: shopping
            - label: Custom
              value: custom
    slot_3_id:
      name: Slot 3 ID
      description: Leave the ID or label empty to hide this slot.
      default: ""
      selector:
        text:
    slot_3_label:
      name: Slot 3 label
      default: ""
      selector:
        text:
    slot_3_behavior:
      name: Slot 3 behavior
      default: use
      selector:
        select:
          options:
            - label: Use
              value: use
            - label: Shopping
              value: shopping
            - label: Custom
              value: custom
    slot_4_id:
      name: Slot 4 ID
      description: Leave the ID or label empty to hide this slot.
      default: ""
      selector:
        text:
    slot_4_label:
      name: Slot 4 label
      default: ""
      selector:
        text:
    slot_4_behavior:
      name: Slot 4 behavior
      default: use
      selector:
        select:
          options:
            - label: Use
              value: use
            - label: Shopping
              value: shopping
            - label: Custom
              value: custom
    page_1_id:
      name: Page 1 ID
      description: Leave empty for schema-2 style home actions only (no pages).
      default: home
      selector:
        text:
    page_1_label:
      name: Page 1 label
      default: Home
      selector:
        text:
    page_2_id:
      name: Page 2 ID
      description: Leave empty to omit.
      default: ""
      selector:
        text:
    page_2_label:
      name: Page 2 label
      default: ""
      selector:
        text:
    page_3_id:
      name: Page 3 ID
      description: Leave empty to omit.
      default: ""
      selector:
        text:
    page_3_label:
      name: Page 3 label
      default: ""
      selector:
        text:
    widget_1_page:
      name: Widget 1 page ID
      description: Must match a page id. Leave empty to skip this widget.
      default: home
      selector:
        text:
    widget_1_type:
      name: Widget 1 type
      default: text
      selector:
        select:
          options:
            - label: Text
              value: text
            - label: Button
              value: button
            - label: Navigate
              value: nav
    widget_1_id:
      name: Widget 1 ID
      default: hint
      selector:
        text:
    widget_1_label:
      name: Widget 1 label
      default: Scan a product barcode
      selector:
        text:
    widget_1_kind:
      name: Widget 1 button kind
      default: event
      selector:
        select:
          options:
            - label: Event
              value: event
            - label: Search
              value: search
    widget_1_target:
      name: Widget 1 nav target page
      default: ""
      selector:
        text:
    widget_2_page:
      name: Widget 2 page ID
      default: home
      selector:
        text:
    widget_2_type:
      name: Widget 2 type
      default: button
      selector:
        select:
