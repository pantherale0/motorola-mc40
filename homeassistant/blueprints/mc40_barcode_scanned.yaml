blueprint:
  name: MC40 barcode scanned
  description: >
    Fires when the Motorola MC40 companion app scans a barcode.
    event_data.mode is the configured slot ID (e.g. use or shopping) so you
    can show a product overlay (notify) or branch your automations.
  domain: automation
  source_url: https://github.com/pantherale0/motorola-mc40
  input:
    scan_action:
      name: Action on scan
      description: What to do with the barcode payload (branch on trigger.event.data.mode)
      selector:
        action:

trigger:
  - platform: event
    event_type: mc40_barcode_scanned

action: !input scan_action
