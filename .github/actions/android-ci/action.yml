name: Android CI setup
description: JDK 17, Gradle, and Android SDK 33 for the MC40 companion

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install platform 33
      shell: bash
      run: sdkmanager --install "platforms;android-33" "build-tools;33.0.2"

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x gradlew
