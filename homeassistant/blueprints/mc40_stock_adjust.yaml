blueprint:
  name: MC40 mode confirm
  description: >
    Fires when Confirm is pressed on a product overlay (event mc40_mode_confirm).
    quantity is the confirmed amount. Branch on trigger.event.data.mode (slot ID)
    for use / shopping / custom workflows.
  domain: automation
  source_url: https://github.com/pantherale0/motorola-mc40
  input:
    adjust_action:
      name: Action on confirm
      selector:
        action:

trigger:
  - platform: event
    event_type: mc40_mode_confirm

action: !input adjust_action
